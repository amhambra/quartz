
#============================================================================
# Configure Main Scheduler Properties  
#============================================================================

org.quartz.scheduler.instanceName=${instanceName}
org.quartz.scheduler.instanceId=AUTO
org.quartz.scheduler.instanceIdGenerator.class=org.quartz.simpl.SystemPropertyInstanceIdGenerator
org.quartz.scheduler.instanceIdGenerator.systemPropertyName=quartz.unique.instance.id

#============================================================================
# Configure ThreadPool  
#============================================================================

org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount=5
org.quartz.threadPool.threadPriority=5

#============================================================================
# Configure JobStore  
#============================================================================

org.quartz.jobStore.misfireThreshold=60000

org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.MSSQLDelegate
org.quartz.jobStore.useProperties=false
org.quartz.jobStore.dataSource=myDS
org.quartz.jobStore.tablePrefix=QRTZ_
org.quartz.jobStore.isClustered=true

#============================================================================
# Configure Datasources  
#============================================================================

org.quartz.dataSource.myDS.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
org.quartz.dataSource.myDS.URL=jdbc:sqlserver://n01.harryboing.de:1433;databaseName=quartz252;encrypt=true;trustServerCertificate=true
org.quartz.dataSource.myDS.user=SA
org.quartz.dataSource.myDS.password=Coconet123
org.quartz.dataSource.myDS.maxConnections=5
org.quartz.dataSource.myDS.validationQuery=select 0

# Force c3p0 to disable statement caching completely
org.quartz.dataSource.myDS.maxStatements=0
org.quartz.dataSource.myDS.maxStatementsPerConnection=0

# Highly Recommended for SQL Server: Tell c3p0 to validate connections before trying to run Quartz queries
org.quartz.dataSource.myDS.preferredTestQuery=SELECT 1
org.quartz.dataSource.myDS.testConnectionOnCheckin=true

